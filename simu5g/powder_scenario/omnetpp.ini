[General]

network = simu5g.simulations.nr.networks.SingleCell_Standalone

**.routingRecorder.enabled = false

output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec

seed-set = ${repetition}

**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.rcvdPowerDl:vector.vector-recording = true

# Keep only useful statistics
**.vector-recording = false

############ Network ############

*.numUe = 1
*.numBgCells = 0

*.configurator.config = xmldoc("./demo.xml")

############ Physical area ############

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m

**.mobility.constraintAreaMaxX = 600m
**.mobility.constraintAreaMaxY = 450m
**.mobility.constraintAreaMaxZ = 50m

**.mobility.initFromDisplayString = false

############ Carrier ############

*.carrierAggregation.numComponentCarriers = 1

# POWDER NR configuration
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.40464GHz

# mu=1 => 30 kHz SCS
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

# 40 MHz @ 30 kHz SCS
*.carrierAggregation.componentCarrier[0].numBands = 106

*.gnb.cellularNic.numCarriers = 1
*.gnb.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############ Association ############

*.ue[*].macCellId = 0
*.ue[*].masterId = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId = 1

**.dynamicCellAssociation = false
**.enableHandover = false

############ gNB position ############

# Nominal MEB gNB position = origin before spatial shift
*.gnb.mobility.initialX = 150m
*.gnb.mobility.initialY = 50m
*.gnb.mobility.initialZ = 10m

############ UE mobility ############

*.ue[*].mobility.typename = "BonnMotionMobility"
*.ue[*].mobility.nodeId = -1
*.ue[*].mobility.is3D = true

############ Channel model ############

**.scenario = "URBAN_MICROCELL"

# Same geometry assumptions as analytical baseline
**.nodebHeight = 10m
**.ueHeight = 1.5m

# OSM audit: all evaluation points LOS
**.dynamicLos = false
**.fixedLos = true

# Main simulation benchmark
**.shadowing = true
**.fading = false

**.insideBuilding = false

# Unknown physical link-budget terms deliberately neutralized.
# One scalar offset will later be calibrated on TRAIN only.
**.antennaGainUe = 0dBi
**.antennGainEnB = 0dBi
**.cableLoss = 0dB

############ Interference ############

# Single serving cell
**.downlinkInterference = false
**.uplinkInterference = false
**.bgCellInterference = false
**.extCellInterference = false

############ Power ############

# Arbitrary nominal reference.
# Absolute link-budget offset is calibrated on training run only.
**.eNodeBTxPower = 0dBm

############ PHY ############

**.targetBler = 0.01
**.fbPeriod = 40tti


[Config POWDER-Run1]

sim-time-limit = 702.179s

*.ue[*].mobility.traceFile = "run1.bonnmotion"

# Downlink packets only to activate normal NR PHY/channel processing
*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[0].typename = "CbrSender"
*.server.app[0].packetSize = 100B
*.server.app[0].samplingTime = 0.02s
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].startTime = 0.01s
*.server.app[0].finishTime = 702.17s


[Config POWDER-Run2]

sim-time-limit = 480.836s

*.ue[*].mobility.traceFile = "run2.bonnmotion"

*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[0].typename = "CbrSender"
*.server.app[0].packetSize = 100B
*.server.app[0].samplingTime = 0.02s
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].startTime = 0.01s
*.server.app[0].finishTime = 480.83s

# POWDER benchmark instrumentation
